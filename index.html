<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Mavzu sahifa chizilishidan oldin qo'yiladi, aks holda React yuklanguncha yorug' mavzu "miltillab" ketadi.
      // Asosiy mavzu — qorong'i; kalit App.tsx dagi sozlamalar kaliti bilan bir xil.
      try {
        var theme = JSON.parse(localStorage.getItem("cbct-opt:settings:v3") || "{}").theme || "dark";
        if (theme !== "auto") document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Stomatologik CBCT apparati qismlarini almashtirish va ta'mirlash xarajatlarini dinamik dasturlash asosida optimallashtirish" />
    <meta name="theme-color" content="#f2f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1218" media="(prefers-color-scheme: dark)" />
    <title>CBCT xarajat optimizatori</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234352c9'/%3E%3Cpath d='M6 22 Q16 4 26 22' stroke='%23f0a24a' stroke-width='3' fill='none'/%3E%3Ccircle cx='6' cy='22' r='3' fill='%23fff'/%3E%3Ccircle cx='26' cy='22' r='3' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
